<style>
:root{
  --ink:#1E2A4A; --ink-soft:#4A5677; --paper:#EEF5FC; --grid:#D6E6F5; --card:#FFFFFF;
  --sun:#FFC93C; --sun-deep:#E8A600; --mint:#2BA57F; --mint-soft:#DDF3EA;
  --berry:#E2457A; --berry-soft:#FCE3EC; --sky:#2F7FD8; --line:#C9D8EA;
  --shadow:0 3px 0 #C3D4E8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#EAF0FA; --ink-soft:#A9B6CF; --paper:#121A2E; --grid:#1B2540; --card:#1A2440;
    --sun:#FFC93C; --sun-deep:#FFD866; --mint:#43C79C; --mint-soft:#163A33;
    --berry:#FF6B9A; --berry-soft:#3A1B2A; --sky:#6AA8F0; --line:#2C3A5E; --shadow:0 3px 0 #0B1122;
  }
}
:root[data-theme="dark"]{
  --ink:#EAF0FA; --ink-soft:#A9B6CF; --paper:#121A2E; --grid:#1B2540; --card:#1A2440;
  --sun:#FFC93C; --sun-deep:#FFD866; --mint:#43C79C; --mint-soft:#163A33;
  --berry:#FF6B9A; --berry-soft:#3A1B2A; --sky:#6AA8F0; --line:#2C3A5E; --shadow:0 3px 0 #0B1122;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;color:var(--ink);font-family:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.5;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
}
h1,h2,h3{font-family:"Baloo 2","Lexend",system-ui,sans-serif;line-height:1.1;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 110px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.35rem;display:flex;align-items:center;gap:8px}
.brand .dot{width:30px;height:30px;border-radius:9px;background:var(--sun);display:grid;place-items:center;color:#1E2A4A;font-size:1rem;transform:rotate(-6deg)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:600;font-size:.9rem}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.hello h1{font-size:clamp(2rem,6vw,2.8rem);font-weight:800}
.hello p{margin:.3rem 0 0;color:var(--ink-soft);max-width:60ch}
.count{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:12px}
.count b{font-family:"Baloo 2",sans-serif;font-size:3.2rem;line-height:1;font-weight:800;color:var(--berry)}
.count span{color:var(--ink-soft)}
/* Trail */
.trail{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:8px;margin-top:12px}
.stone{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:.78rem;font-weight:600;border:2px dashed var(--line);color:var(--ink-soft);position:relative}
.stone.done{background:var(--sun);border:2px solid var(--sun-deep);color:#1E2A4A}
.stone.part{background:var(--mint-soft);border:2px solid var(--mint);color:var(--ink)}
.stone.today{border:3px solid var(--berry);color:var(--ink);font-weight:700}
.stone.miss{opacity:.45}
.stone.flag{background:var(--berry);border:2px solid var(--berry);color:#fff;font-size:1rem}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-soft);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
/* Mission */
.mission{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mission h2{font-size:1.6rem}
.mission p{margin:.25rem 0 0;opacity:.85}
.mission .tag{display:inline-block;background:var(--sun);color:#1E2A4A;border-radius:8px;padding:1px 8px;font-size:.8rem;font-weight:600;margin-bottom:6px}
.btn{border:none;border-radius:14px;padding:12px 20px;font-weight:600;font-size:1rem;background:var(--sun);color:#1E2A4A;box-shadow:0 3px 0 var(--sun-deep);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sun-deep)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:var(--shadow)}
.btn.mint{background:var(--mint);color:#fff;box-shadow:0 3px 0 #1d7a5d}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-family:"Baloo 2",sans-serif;font-size:1.9rem;line-height:1.1}
.stat span{font-size:.82rem;color:var(--ink-soft)}
/* Sections */
.secs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.sec{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.sec .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:1.4rem;margin-bottom:8px}
.sec h3{font-size:1.15rem}
.sec p{margin:.2rem 0 0;font-size:.85rem;color:var(--ink-soft)}
.sec .acc{margin-top:8px;font-size:.8rem;font-weight:600}
.c-math{background:#DCEBFB;color:#1E4E8C}.c-flex{background:#EDE6FB;color:#5A3FB0}.c-verbal{background:#FCE3EC;color:#A3214F}.c-science{background:#DDF3EA;color:#1D7A5D}
h2.sh{font-size:1.4rem;margin:22px 0 10px}
/* Quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.bar{height:12px;background:var(--card);border:2px solid var(--line);border-radius:999px;overflow:hidden;flex:1}
.bar>div{height:100%;background:var(--mint);transition:width .3s}
.qcard{padding:22px}
.qsec{font-size:.8rem;font-weight:600;border-radius:8px;padding:2px 10px;display:inline-block;margin-bottom:10px}
.prompt{font-size:1.25rem;font-weight:500;margin:0 0 14px;max-width:60ch}
.vis{display:block;max-width:100%;height:auto;margin:6px auto 16px}
.opts{display:grid;gap:10px}
.opts.grid{grid-template-columns:repeat(2,1fr)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:1.08rem;position:relative;min-height:58px}
.opt .let{flex:none;width:30px;height:30px;border-radius:9px;background:var(--paper);border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.opt .body{flex:1;display:flex;align-items:center;justify-content:center}
.opts:not(.grid) .opt .body{justify-content:flex-start}
.opt svg{width:64px;height:64px}
.opt.sel{border-color:var(--sky);background:color-mix(in srgb,var(--sky) 12%,var(--card))}
.opt.right{border-color:var(--mint);background:var(--mint-soft)}
.opt.wrong{border-color:var(--berry);background:var(--berry-soft)}
.opt.struck .body{opacity:.3;text-decoration:line-through}
.x{flex:none;border:none;background:transparent;width:32px;height:32px;border-radius:8px;color:var(--ink-soft);font-size:1rem}
.x:hover{background:var(--paper)}
.fb{margin-top:14px;border-radius:14px;padding:12px 14px;font-size:.98rem}
.fb.ok{background:var(--mint-soft);border:2px solid var(--mint)}
.fb.no{background:var(--berry-soft);border:2px solid var(--berry)}
.fb b{font-family:"Baloo 2",sans-serif;font-size:1.15rem}
.qfoot{display:flex;gap:10px;margin-top:16px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.hint{font-size:.82rem;color:var(--ink-soft)}
.timer{font-family:"Baloo 2",sans-serif;font-weight:700;font-size:1.2rem}
.timer.low{color:var(--berry)}
/* Results */
.big{font-family:"Baloo 2",sans-serif;font-size:4rem;font-weight:800;line-height:1}
.rows{display:grid;gap:8px;margin-top:10px}
.row{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;font-size:.92rem}
.track{height:14px;border-radius:999px;background:var(--paper);border:2px solid var(--line);overflow:hidden}
.track>div{height:100%;border-radius:999px}
.rev{border-top:2px dashed var(--line);padding:12px 0}
.rev:first-child{border-top:none}
.rev .q{font-weight:500}
.rev .a{font-size:.9rem;color:var(--ink-soft)}
.badges{display:flex;flex-wrap:wrap;gap:10px}
.badge{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-size:.88rem;background:var(--card)}
.badge.off{opacity:.4;filter:grayscale(1)}
.badge i{font-style:normal;font-size:1.3rem}
.hist{font-size:.9rem}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.hist div:first-child{border-top:none}
.chartwrap{overflow-x:auto}
.guide h3{font-size:1.2rem;margin-top:4px}
.guide p,.guide li{color:var(--ink-soft);max-width:65ch}
.guide ol{padding-left:1.2rem}
.guide a{color:var(--sky)}
.phase{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 0;border-top:2px dashed var(--line)}
.phase:first-of-type{border-top:none}
.phase .n{width:36px;height:36px;border-radius:50%;background:var(--sun);color:#1E2A4A;display:grid;place-items:center;font-weight:800;font-family:"Baloo 2",sans-serif}
.phase.now .n{background:var(--berry);color:#fff}
.field{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field input{font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);flex:1;min-width:160px}
.lvtag{margin-top:6px;font-size:.76rem;font-weight:600;display:inline-block;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:2px 9px}
.qnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.qn{width:36px;height:36px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:.9rem;position:relative}
.qn.ansd{background:var(--mint-soft);border-color:var(--mint)}
.qn.cur{outline:3px solid var(--sky);outline-offset:2px}
.qn.flag::after{content:"★";position:absolute;top:-7px;right:-4px;font-size:.78rem;color:var(--berry)}
/* Nav */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{background:none;border:none;padding:10px 4px 12px;font-size:.78rem;font-weight:600;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .i{font-size:1.3rem}
nav button.on{color:var(--ink)}
nav button.on .i{transform:scale(1.15)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:12px;font-weight:600;z-index:20}
@media (max-width:520px){
  .synct{display:none}
  .secs{grid-template-columns:1fr}
  .mission{grid-template-columns:1fr}
  .row{grid-template-columns:100px 1fr 44px}
  .opt svg{width:54px;height:54px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.04)}100%{transform:scale(1)}}

/* ===== Theme: Block World ===== */
html:root[data-skin="blocks"]{
  --ink:#2B2118; --ink-soft:#5E4E3C; --paper:#86C8F2; --grid:rgba(255,255,255,.28); --card:#F1E6CF;
  --sun:#6DBA3B; --sun-deep:#3F7A1F; --mint:#3FA34D; --mint-soft:#D6EFC4;
  --berry:#C8402A; --berry-soft:#F6D8D0; --sky:#2F6FCB; --line:#2B2118; --shadow:0 4px 0 #2B2118;
}
[data-skin="blocks"] body{background-size:32px 32px,32px 32px,100% 100%;background-image:linear-gradient(var(--grid) 2px,transparent 2px),linear-gradient(90deg,var(--grid) 2px,transparent 2px),linear-gradient(transparent calc(100% - 90px),#5DA130 calc(100% - 90px),#5DA130 calc(100% - 74px),#7A5232 calc(100% - 74px));background-attachment:fixed}
[data-skin="blocks"] h1,[data-skin="blocks"] h2,[data-skin="blocks"] h3,[data-skin="blocks"] .brand,[data-skin="blocks"] .count b,[data-skin="blocks"] .stat b,[data-skin="blocks"] .big,[data-skin="blocks"] .fb b{font-family:"Pixelify Sans","Baloo 2",monospace;letter-spacing:.02em}
[data-skin="blocks"] .card,[data-skin="blocks"] .sec,[data-skin="blocks"] .stat,[data-skin="blocks"] .opt,[data-skin="blocks"] .pill,[data-skin="blocks"] .badge,[data-skin="blocks"] .fb{border-radius:0;border:3px solid var(--line);box-shadow:inset -4px -4px 0 rgba(0,0,0,.14),inset 4px 4px 0 rgba(255,255,255,.4)}
[data-skin="blocks"] .card,[data-skin="blocks"] .sec{box-shadow:inset -5px -5px 0 rgba(0,0,0,.14),inset 5px 5px 0 rgba(255,255,255,.4),0 5px 0 #2B2118}
[data-skin="blocks"] .mission{background:#4A4A4A;color:#F4F4F4;border-top:12px solid #5DA130}
[data-skin="blocks"] .mission .tag{border-radius:0;background:#F5C842}
[data-skin="blocks"] .btn{border-radius:0;border:3px solid #2B2118;color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.35);box-shadow:inset -4px -4px 0 rgba(0,0,0,.25),inset 4px 4px 0 rgba(255,255,255,.3)}
[data-skin="blocks"] .btn.ghost{color:var(--ink);text-shadow:none}
[data-skin="blocks"] .stone{border-radius:3px}
[data-skin="blocks"] .stone.done{background:#F5C842;border:3px solid #9A7414;box-shadow:inset -3px -3px 0 rgba(0,0,0,.18),inset 3px 3px 0 rgba(255,255,255,.5)}
[data-skin="blocks"] .stone.flag{border-radius:3px;background:#C8402A}
[data-skin="blocks"] .brand .dot{border-radius:0;background:#5DA130;transform:none;box-shadow:inset 0 -10px 0 #7A5232}
[data-skin="blocks"] .bar,[data-skin="blocks"] .track{border-radius:0}
[data-skin="blocks"] .bar>div,[data-skin="blocks"] .track>div{border-radius:0}
[data-skin="blocks"] .opt .let,[data-skin="blocks"] .sec .ico,[data-skin="blocks"] .qsec{border-radius:0}
[data-skin="blocks"] nav{border-top:4px solid #5DA130}
/* ===== Theme: Superhero ===== */
html:root[data-skin="hero"]{
  --ink:#111111; --ink-soft:#3A3A3A; --paper:#1B5FD9; --grid:transparent; --card:#FFFFFF;
  --sun:#FFD23F; --sun-deep:#111111; --mint:#1FAA59; --mint-soft:#D6F5E3;
  --berry:#E8282B; --berry-soft:#FDE0E0; --sky:#1B5FD9; --line:#111111; --shadow:5px 5px 0 #111;
}
[data-skin="hero"] body{background-image:radial-gradient(rgba(255,255,255,.18) 2px,transparent 2.5px);background-size:16px 16px}
[data-skin="hero"] h1,[data-skin="hero"] h2,[data-skin="hero"] h3,[data-skin="hero"] .brand,[data-skin="hero"] .count b,[data-skin="hero"] .stat b,[data-skin="hero"] .big,[data-skin="hero"] .fb b{font-family:"Bangers","Baloo 2",sans-serif;letter-spacing:.04em;font-weight:400}
[data-skin="hero"] .hello h1{font-size:clamp(2.4rem,7vw,3.4rem);text-shadow:3px 3px 0 #FFD23F}
[data-skin="hero"] .card,[data-skin="hero"] .sec,[data-skin="hero"] .stat,[data-skin="hero"] .opt,[data-skin="hero"] .pill,[data-skin="hero"] .badge{border:3px solid #111;box-shadow:5px 5px 0 #111}
[data-skin="hero"] .opt,[data-skin="hero"] .pill{box-shadow:3px 3px 0 #111}
[data-skin="hero"] .mission{background:#E8282B;color:#fff;border-color:#111;transform:rotate(-.6deg)}
[data-skin="hero"] .mission .tag{background:#FFD23F;border:2px solid #111}
[data-skin="hero"] .mission h2{font-size:2rem;text-shadow:2px 2px 0 #111}
[data-skin="hero"] .btn{border:3px solid #111;box-shadow:4px 4px 0 #111;font-weight:700}
[data-skin="hero"] .btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #111}
[data-skin="hero"] .btn.mint{color:#fff}
[data-skin="hero"] .fb{border:3px solid #111;box-shadow:4px 4px 0 #111}
[data-skin="hero"] .fb b{font-size:1.5rem}
[data-skin="hero"] .stone{border-style:solid;border-color:#111;background:#fff;color:#111}
[data-skin="hero"] .stone.done{background:#FFD23F;border:3px solid #111}
[data-skin="hero"] .stone.miss{opacity:.6;background:#cfd8ea}
[data-skin="hero"] .stone.flag{background:#E8282B;border:3px solid #111}
[data-skin="hero"] .brand .dot{background:#FFD23F;border:2px solid #111}
[data-skin="hero"] .wrap>h1,[data-skin="hero"] .wrap>h2,[data-skin="hero"] .wrap>p,[data-skin="hero"] .brand,[data-skin="hero"] .guide>h1,[data-skin="hero"] .wrap>div>h1{color:#fff!important;text-shadow:3px 3px 0 #111}
[data-skin="hero"] .qhead+div{color:#fff!important}
[data-skin="hero"] nav{border-top:3px solid #111}
/* Theme picker */
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 4px}
.skin{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 6px;font-weight:600;font-size:.88rem;display:flex;flex-direction:column;align-items:center;gap:4px}
.skin i{font-style:normal;font-size:1.6rem}
.skin.on{outline:3px solid var(--sky);outline-offset:2px}
</style>

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const pad = n => String(n).padStart(2,"0");

const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function nearNums(ans, cands){
  const out=[]; for(const c of shuffle(cands)){ if(c!==ans && c>=0 && !out.includes(c)) out.push(c); if(out.length===3) break; }
  let k=1; while(out.length<3){ const c=ans+k*(k%2?1:-1)*Math.ceil(k/2); if(c>=0&&c!==ans&&!out.includes(c)) out.push(c); k++; }
  return out.map(String);
}

/* ---------------- SVG helpers ---------------- */
function shp(t,c,cx,cy,r,x2){
  x2=x2||"";
  switch(t){
    case "circle": return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${c}" ${x2}/>`;
    case "square": {const s=r*1.6;return `<rect x="${cx-s/2}" y="${cy-s/2}" width="${s}" height="${s}" rx="3" fill="${c}" ${x2}/>`;}
    case "triangle": return `<polygon points="${cx},${cy-r} ${cx+r*.95},${cy+r*.75} ${cx-r*.95},${cy+r*.75}" fill="${c}" ${x2}/>`;
    case "diamond": return `<polygon points="${cx},${cy-r} ${cx+r*.85},${cy} ${cx},${cy+r} ${cx-r*.85},${cy}" fill="${c}" ${x2}/>`;
    case "star": {let p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;p.push((cx+rr*Math.cos(a)).toFixed(1)+","+(cy+rr*Math.sin(a)).toFixed(1));}return `<polygon points="${p.join(" ")}" fill="${c}" ${x2}/>`;}
    case "hexagon": {let p=[];for(let i=0;i<6;i++){const a=i*Math.PI/3;p.push((cx+r*Math.cos(a)).toFixed(1)+","+(cy+r*Math.sin(a)).toFixed(1));}return `<polygon points="${p.join(" ")}" fill="${c}" ${x2}/>`;}
  }
}
const svg = (w,h,inner,label,cls="vis",maxw) => `<svg viewBox="0 0 ${w} ${h}" class="${cls}" role="img" aria-label="${esc(label||"picture")}" ${maxw?`style="max-width:${maxw}px"`:""} xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;

const INK = "currentColor";
function arrow(dir){ // dir in degrees: 0 up
  return `<g transform="rotate(${dir} 40 40)"><rect x="34" y="34" width="12" height="30" rx="3" fill="${INK}"/><polygon points="40,10 60,38 20,38" fill="#E2457A"/></g>`;
}
function dots(n,x,y,w){ // dots in a box
  let s=`<rect x="${x}" y="${y}" width="${w}" height="${w}" rx="10" fill="none" stroke="${INK}" stroke-opacity=".35" stroke-width="2"/>`;
  const cols=n<=4?2:3, gap=w/(cols+1);
  for(let i=0;i<n;i++){const r=Math.floor(i/cols),c=i%cols;s+=`<circle cx="${x+gap*(c+1)}" cy="${y+gap*(r+1)}" r="${w/12}" fill="#2F7FD8"/>`;}
  return s;
}

/* ---------------- Question builder ---------------- */
function make(sec,prompt,visual,correct,wrongs,explain,kind="text"){
  const items=shuffle([{v:correct,ok:true},...wrongs.map(v=>({v,ok:false}))]);
  return {sec,prompt,visual,kind,options:items.map(i=>i.v),answer:items.findIndex(i=>i.ok),explain,key:prompt+(visual||"").length+correct};
}

function genSeq(lv){

  if(t===0){const s=rnd(1,9),d=rnd(2,6);terms=[0,1,2,3].map(i=>s+i*d);ans=s+4*d;why=`Each number goes up by ${d}.`;}
  else if(t===1){const s=rnd(1,4);terms=[s,s*2,s*4,s*8];ans=s*16;why="Each number is doubled (×2).";}
  else if(t===2){const s=rnd(1,6);terms=[s,s+1,s+3,s+6];ans=s+10;why="Add 1, then 2, then 3… so next add 4.";}
  else if(t===3){const s=rnd(5,10),a=rnd(3,5),b=rnd(1,2);terms=[s,s+a,s+a-b,s+2*a-b];ans=s+2*a-2*b;why=`The pattern is +${a}, −${b}, +${a}, −${b}.`;}
  else if(t===4){const s=rnd(1,3);let x=s;terms=[x];for(let i=0;i<3;i++){x=x*2+1;terms.push(x);}ans=x*2+1;why="Double the number, then add 1.";}
  else {const s=rnd(40,60),d=rnd(3,7);terms=[0,1,2,3].map(i=>s-i*d);ans=s-4*d;why=`Each number goes down by ${d}.`;}
  const diff=terms[3]-terms[2];
  return make("math",`What number comes next?<br><span style="font-family:'Baloo 2';font-size:1.7rem;letter-spacing:.04em">${terms.join(" → ")} → ?</span>`,null,String(ans),nearNums(ans,[ans+1,ans-1,ans+2,ans-2,terms[3]+diff,ans+diff]),why);
}
function genWord(lv){

  if(t===1){const a=rnd(8,15),b=rnd(2,6),c=rnd(2,6);const ans=a-b+c;return make("math",`${n} had ${a} stickers. He gave ${b} to a friend, then got ${c} more. How many stickers now?`,null,String(ans),nearNums(ans,[a+b+c,a-b-c,a-b,ans+1]),`${a} − ${b} = ${a-b}, then + ${c} = ${ans}.`);}

function genRotate(lv){
  const start=pick([0,90,180,270]),t=rnd(0,3);
  let end,text,why;
  if(t===0){end=(start+90)%360;text="turns a quarter turn clockwise (like a clock's hands)";why="A quarter turn clockwise moves the arrow one step to the right around the circle.";}
  else if(t===1){end=(start+270)%360;text="turns a quarter turn counter-clockwise";why="Counter-clockwise is the opposite way to a clock's hands.";}
  else if(t===2){end=(start+180)%360;text="turns a half turn";why="A half turn makes the arrow point the opposite way.";}
  else {end=(360-start)%360;text="is seen in a mirror standing beside it";why="A side mirror swaps left and right, but up and down stay the same.";}

function genOdd(){

function genGrowth(lv){

  o.stats={};for(const k of SEC_KEYS)o.stats[k]={c:0,t:0};

function normalize(x){
  const b=blank();x=x||{};
  b.name=typeof x.name==="string"?x.name:"";b.nameAt=+x.nameAt||0;b.skin=SKINS[x.skin]?x.skin:"classic";b.skinAt=+x.skinAt||0;b.resetAt=+x.resetAt||0;b.updatedAt=+x.updatedAt||0;
  b.sessions=(Array.isArray(x.sessions)?x.sessions:[]).filter(s=>s&&typeof s.at==="number"&&s.at>b.resetAt).sort((a,c)=>a.at-c.at).slice(-1000);
  return rebuild(b);
}
function merge(a,b){ // combine two copies without losing anyone's rounds
  const o=blank();
  o.resetAt=Math.max(a.resetAt||0,b.resetAt||0);
  const seen=new Map();for(const s of [...a.sessions,...b.sessions])if(s.at>o.resetAt)seen.set(s.at+"|"+s.mode+"|"+s.t,s);
  o.sessions=[...seen.values()].sort((x,y)=>x.at-y.at).slice(-1000);
  const nb=(b.nameAt||0)>(a.nameAt||0)?b:a;o.name=nb.name;o.nameAt=nb.nameAt||0;const sb=(b.skinAt||0)>(a.skinAt||0)?b:a;o.skin=sb.skin||"classic";o.skinAt=sb.skinAt||0;
  o.updatedAt=Math.max(a.updatedAt||0,b.updatedAt||0);
  return rebuild(o);
}

function startQuiz(mode,sec){
  let plan;
  if(mode==="mission"){
    const ph=phase();const others=SEC_KEYS.filter(k=>!ph.focus.includes(k));
    if(ph.n===4) plan=shuffle([...SEC_KEYS,...SEC_KEYS,"math","flex"]).slice(0,10);
    else{const f=[];for(let i=0;i<6;i++)f.push(ph.focus[i%ph.focus.length]);const o=[];for(let i=0;i<4;i++)o.push((others.length?others:SEC_KEYS)[i%(others.length||4)]);plan=shuffle([...f,...o]);}
  } else if(mode==="mock"){plan=shuffle([...Array(5).fill("math"),...Array(5).fill("flex"),...Array(5).fill("verbal"),...Array(5).fill("science")]);}
  else plan=Array(10).fill(sec);
  if(mode==="exam"){
    const parts=EXAM_PLAN.map(p=>{
      const list=buildSet(Array(p.n).fill(p.sec));
      return {sec:p.sec,dur:p.secs,list,ans:list.map(()=>null),flag:list.map(()=>false),struck:list.map(()=>new Set()),used:0};
    });
    Q={mode:"exam",sec:null,parts,si:0,qi:0,start:Date.now(),end:Date.now()+parts[0].dur*1000,
       list:[],ans:[],struck:[],picked:null,locked:false};
    render();window.scrollTo(0,0);clearInterval(timerInt);timerInt=setInterval(tick,500);return;
  }
  Q={mode,sec,list:buildSet(plan),i:0,ans:[],struck:[],picked:null,locked:false,start:Date.now(),end:mode==="mock"?Date.now()+25*60e3:null};
  Q.struck=Q.list.map(()=>new Set());
  render();window.scrollTo(0,0);
  if(Q.end){clearInterval(timerInt);timerInt=setInterval(tick,1000);}
}
function tick(){
  if(!Q||!Q.end){clearInterval(timerInt);return;}
  const left=Math.max(0,Q.end-Date.now());const el=$("#timer");
  if(el){el.textContent=fmt(left);el.classList.toggle("low",left<(Q.mode==="exam"?60e3:3*60e3));}
  if(left<=0){if(Q.mode==="exam"){nextPart(true);return;}clearInterval(timerInt);while(Q.ans.length<Q.list.length)Q.ans.push(null);finish();}
}
function nextPart(auto){
  const p=Q.parts[Q.si];p.used=p.dur-Math.max(0,Math.round((Q.end-Date.now())/1000));
  if(Q.si>=Q.parts.length-1){clearInterval(timerInt);finishExam();return;}
  Q.si++;Q.qi=0;Q.end=Date.now()+Q.parts[Q.si].dur*1000;
  render();window.scrollTo(0,0);
  if(auto)toast("Time up — moving on");
}
function finishExam(){
  clearInterval(timerInt);
  const list=[],ans=[];
  for(const p of Q.parts){p.list.forEach((q,i)=>{list.push(q);ans.push(p.ans[i]);});}
  const secsTaken=Math.round((Date.now()-Q.start)/1000);
  let c=0;const by={};
  list.forEach((q,i)=>{const ok=ans[i]===q.answer;if(ok)c++;by[q.sec]=by[q.sec]||[0,0];by[q.sec][1]++;if(ok)by[q.sec][0]++;});
  const before=BADGES.filter(b=>b.ok()).length;
  S.sessions.push({at:Date.now(),mode:"exam",sec:null,c,t:list.length,secs:secsTaken,by});
  if(S.sessions.length>1000)S.sessions=S.sessions.slice(-1000);
  save();
  Q.list=list;Q.ans=ans;
  Q.result={c,t:list.length,by,secs:secsTaken,newBadges:BADGES.filter(b=>b.ok()).length-before};
  Q.done=true;render();window.scrollTo(0,0);
}

  <div style="font-family:'Baloo 2';font-weight:700;color:var(--ink-soft);margin-bottom:8px">${title}</div>
  <section class="card qcard">
    <span class="qsec ${SECS[q.sec].cls}">${SECS[q.sec].ico} ${SECS[q.sec].name}</span>
    <p class="prompt">${q.prompt}</p>
    ${q.visual||""}
    <div class="opts ${grid?"grid":""}">${opts}</div>
    ${fb}
    <div class="qfoot"><span class="hint">${Q.locked?"":"Tip: tap ✕ to cross out answers you know are wrong."}</span>
    ${mock?`<button class="btn" data-act="next" ${Q.picked===null?"disabled":""}>${Q.i===n-1?"Finish test":"Next"}</button>`
      :Q.locked?`<button class="btn" data-act="next">${Q.i===n-1?"See results":"Next question"}</button>`
      :`<button class="btn" data-act="check" ${Q.picked===null?"disabled":""}>Check answer</button>`}
    </div>
  </section>`;
}
function finish(){
  clearInterval(timerInt);
  const secs=Math.round((Date.now()-Q.start)/1000);
  let c=0;const by={};
  Q.list.forEach((q,i)=>{const ok=Q.ans[i]===q.answer;if(ok)c++;by[q.sec]=by[q.sec]||[0,0];by[q.sec][1]++;if(ok)by[q.sec][0]++;});
  const before=BADGES.filter(b=>b.ok()).length;
  S.sessions.push({at:Date.now(),mode:Q.mode,sec:Q.sec||null,c,t:Q.list.length,secs,by});
  if(S.sessions.length>1000)S.sessions=S.sessions.slice(-1000);
  save();
  Q.result={c,t:Q.list.length,by,secs,newBadges:BADGES.filter(b=>b.ok()).length-before};
  Q.done=true;render();window.scrollTo(0,0);
}
function vResult(){
  const r=Q.result,pct=Math.round(100*r.c/r.t);
  const msg=pct>=90?"Outstanding!":pct>=70?"Great job!":pct>=50?"Good effort — keep going!":"Every mistake teaches something. Let's review!";
  const rows=Object.keys(r.by).map(k=>{const [c,t]=r.by[k];return `<div class="row"><span>${SECS[k].ico} ${SECS[k].name.split(" ")[0]}</span><div class="track"><div style="width:${100*c/t}%;background:var(--mint)"></div></div><b>${c}/${t}</b></div>`;}).join("");
  const letters="ABCD";
  const review=Q.list.map((q,i)=>{const ok=Q.ans[i]===q.answer;if(ok&&Q.mode!=="mock"&&Q.mode!=="exam")return "";return `<div class="rev"><div class="q">${ok?"✅":"❌"} ${q.prompt}</div>${q.visual?`<div style="max-width:260px">${q.visual}</div>`:""}<div class="a">${Q.ans[i]==null?"Not answered. ":ok?"":`Picked ${letters[Q.ans[i]]}. `}Answer: <b>${letters[q.answer]}</b>${q.kind==="text"?` — ${q.options[q.answer]}`:""}. ${q.explain}</div></div>`;}).join("");
  return `<section class="card" style="text-align:center">
    <div class="big pop">${r.c}/${r.t}</div>
    <h2 style="font-size:1.6rem;margin-top:6px">${msg}</h2>
    <p style="color:var(--ink-soft);margin:.3rem 0 0">${Math.max(1,Math.round(r.secs/60))} minutes · +${r.c} ⭐${Q.mode==="mission"?" · Today's stone is lit ★":""}${r.newBadges>0?" · New badge unlocked!":""}</p>
  </section>
  <section class="card"><h3 style="font-size:1.2rem">By area</h3><div class="rows">${rows}</div></section>
  ${review?`<section class="card"><h3 style="font-size:1.2rem;margin-bottom:6px">${Q.mode==="mock"||Q.mode==="exam"?"Full review":"Let's look at the tricky ones"}</h3>${review}</section>`:""}
  <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="home">Back to Today</button><button class="btn ghost" data-act="again">Another round</button></div>`;
}

function vLogin(){
  if(!FB.ready)return `<section class="card" style="margin-top:20vh;text-align:center"><h2>Loading…</h2></section>`;
  return `<div class="top"><div class="brand"><span class="dot">✦</span>Mawhiba Quest</div></div>
  <section class="card" style="max-width:420px;margin:8vh auto 0">
    <h1 style="font-size:1.8rem">Family sign in</h1>
    <p style="color:var(--ink-soft);margin:.3rem 0 14px">Use the family email and password so progress syncs across your phones.</p>
    <div style="display:grid;gap:10px" class="field">
      <input id="em" type="email" autocomplete="username" placeholder="Family email" aria-label="Email">
      <input id="pw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password">
      <button class="btn wide" data-act="signin">Sign in</button>
      ${FB.authErr?`<p style="color:var(--berry);margin:0;font-size:.9rem">${esc(FB.authErr)}</p>`:""}
    </div>
  </section>`;
}
/* ---------------- Render & events ---------------- */
function render(){
  document.documentElement.setAttribute("data-skin",SKINS[S.skin]?S.skin:"classic");
  const app=$("#app");
  if(SYNC_ON&&!FB.user){app.innerHTML=vLogin();document.querySelector("nav").style.display="none";return;}
  if(Q)app.innerHTML=Q.done?vResult():Q.mode==="exam"?vExam():vQuiz();
  else app.innerHTML=view==="today"?vToday():view==="practice"?vPractice():view==="progress"?vProgress():vGuide();
  renderNav();
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.go){go(t.dataset.go);return;}
  if(t.dataset.sec){startQuiz("practice",t.dataset.sec);return;}
  if(t.dataset.ego!==undefined&&Q&&Q.parts){Q.qi=+t.dataset.ego;render();window.scrollTo(0,0);return;}
  if(t.dataset.eopt!==undefined&&Q&&Q.parts){const p=Q.parts[Q.si],i=+t.dataset.eopt;p.struck[Q.qi].delete(i);p.ans[Q.qi]=i;render();return;}
  if(t.dataset.ex!==undefined&&Q&&Q.parts){const p=Q.parts[Q.si],i=+t.dataset.ex,s=p.struck[Q.qi];s.has(i)?s.delete(i):s.add(i);if(p.ans[Q.qi]===i)p.ans[Q.qi]=null;render();return;}
  if(t.dataset.x!==undefined&&Q&&!Q.locked){const i=+t.dataset.x,s=Q.struck[Q.i];s.has(i)?s.delete(i):s.add(i);if(Q.picked===i)Q.picked=null;render();return;}
  if(t.dataset.opt!==undefined&&Q&&!Q.locked){const i=+t.dataset.opt;if(Q.struck[Q.i].has(i))Q.struck[Q.i].delete(i);Q.picked=i;render();return;}
  const a=t.dataset.act;if(!a)return;
  if(a==="mission")startQuiz("mission");
  else if(a==="mock")startQuiz("mock");
  else if(a==="check"&&Q&&Q.picked!==null){Q.locked=true;render();}
  else if(a==="next"&&Q){
    Q.ans[Q.i]=Q.picked;
    if(Q.i===Q.list.length-1){finish();return;}
    Q.i++;Q.picked=null;Q.locked=false;render();window.scrollTo(0,0);
  }
  else if(a==="eprev"){Q.qi=Math.max(0,Q.qi-1);render();window.scrollTo(0,0);}
  else if(a==="enext"){Q.qi=Math.min(Q.parts[Q.si].list.length-1,Q.qi+1);render();window.scrollTo(0,0);}
  else if(a==="eflag"){const p=Q.parts[Q.si];p.flag[Q.qi]=!p.flag[Q.qi];render();}
  else if(a==="edone"){
    const p=Q.parts[Q.si],un=p.ans.filter(x=>x===null).length;
    const last=Q.si===Q.parts.length-1;
    if(confirm(un?`${un} question${un>1?"s are":" is"} still unanswered. Close this part for good?`:"Close this part for good? You can't come back to it."))nextPart(false);
  }
  else if(a==="exam"){if(confirm("This is the full test: 64 questions in 12 timed parts, about 103 minutes. Once a part's time ends you cannot go back. Ready?"))startQuiz("exam");}
  else if(a==="quit"){if(confirm("Stop this round? Answers so far won't be saved."))go(view);}
  else if(a==="home")go("today");
  else if(a==="again"){const m=Q.mode,s=Q.sec;startQuiz(m,s);}
  else if(a==="skin"||a==="cycleskin"){
    const v=a==="skin"?t.dataset.v:SKIN_KEYS[(SKIN_KEYS.indexOf(S.skin||"classic")+1)%SKIN_KEYS.length];
    if(SKINS[v]){S.skin=v;S.skinAt=Date.now();save();render();toast(SKINS[v].emoji+" "+SKINS[v].name+" theme");}
  }
  else if(a==="savename"){S.name=($("#nm").value||"").trim().slice(0,24);S.nameAt=Date.now();save();toast("Name saved");render();}
  else if(a==="signin"){
    const em=($("#em").value||"").trim(),pw=$("#pw").value||"";
    if(!em||!pw){FB.authErr="Enter the email and password.";render();return;}
    t.disabled=true;FB.authErr="";
    firebase.auth().signInWithEmailAndPassword(em,pw).catch(err=>{
      FB.authErr=/invalid|wrong|not-found|credential/i.test(err.code||"")?"Email or password is not correct.":/network/i.test(err.code||"")?"No internet connection. Try again.":"Sign in failed: "+(err.code||"unknown error");
      render();
    });
  }
  else if(a==="signout"){if(confirm("Sign out on this device?"))firebase.auth().signOut();}
  else if(a==="backup"){
    const blob=new Blob([JSON.stringify(plain(S))],{type:"application/json"});
    const u=URL.createObjectURL(blob);const l=document.createElement("a");
    l.href=u;l.download="mawhiba-progress-"+todayKey()+".json";document.body.appendChild(l);l.click();l.remove();
    setTimeout(()=>URL.revokeObjectURL(u),1000);toast("Backup downloaded");
  }
  else if(a==="restore"){const f=$("#rf");f.value="";f.click();}
  else if(a==="reset"){if(confirm("Delete all progress, streaks and badges? This can't be undone.")){const n=S.name,na=S.nameAt,sk=S.skin,ska=S.skinAt;S=blank();S.name=n;S.nameAt=na;S.skin=sk;S.skinAt=ska;S.resetAt=Date.now();FB.lastRemote=null;save();toast("Progress reset");render();}}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="pw"){const b=document.querySelector('[data-act="signin"]');if(b)b.click();}});
document.addEventListener("change",e=>{
  if(e.target.id!=="rf"||!e.target.files[0])return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.sessions))throw 0;
    if(!confirm("Add the rounds from this backup to the current progress?"))return;
    S=merge(S,normalize(d));save();toast("Backup restored");render();}catch(err){toast("That file isn't a Mawhiba Quest backup");}};
  r.readAsText(e.target.files[0]);
});
render();
initFirebase();
})();
</script>
</body>
</html>
